<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f4ee" />
    <meta name="description" content="Простой список задач. Добавляйте, отмечайте сделанное и двигайтесь по порядку." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>По порядку — список задач</title>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="Управление списками">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✓</span>по порядку</div>
        <div class="sidebar-heading">
          <h2>Мои списки</h2>
          <button id="create-list" class="icon-button" type="button" aria-label="Новый список" title="Новый список" data-create-list>+</button>
        </div>
        <nav class="list-nav" aria-label="Списки задач"></nav>
      </aside>
      <header class="mobile-header">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✓</span>по порядку</div>
        <button id="open-lists" class="text-button" type="button" aria-haspopup="dialog">Списки</button>
      </header>
      <main class="workspace" aria-label="Управление задачами">
        <div class="workspace-heading">
          <div class="heading-text">
            <h1 id="active-list-title">Мои задачи</h1>
            <p id="task-count">Пока пусто</p>
          </div>
          <details id="list-menu" class="action-menu">
            <summary class="icon-button" aria-label="Действия со списком" title="Действия со списком">⋯</summary>
            <div class="menu-actions">
              <button id="rename-list" type="button">Переименовать</button>
              <button id="delete-list" class="danger-text" type="button">Удалить список</button>
              <p id="last-list-hint">Последний список удалить нельзя.</p>
            </div>
          </details>
        </div>
        <p id="storage-warning" class="storage-warning" role="status" hidden></p>
        <button id="add-task" class="add-trigger" type="button" aria-expanded="false" aria-controls="task-form"><span aria-hidden="true">+</span> Добавить задачу</button>
        <form id="task-form" class="task-editor add-editor" novalidate hidden>
          <label for="task-title">Что нужно сделать?</label>
          <input id="task-title" name="title" class="edit-input" type="text" placeholder="Например, прочитать главу книги" autocomplete="off" aria-describedby="input-error" />
          <p id="input-error" class="edit-error" aria-live="polite"></p>
          <div class="edit-controls">
            <button id="cancel-add-task" class="edit-cancel" type="button">Отмена</button>
            <button class="edit-save" type="submit">Добавить</button>
          </div>
        </form>
        <ul id="task-list" aria-label="Задачи"></ul>
        <div id="empty-state" class="empty-state">
          <h2>Начните с одного дела</h2>
          <p>Добавьте первую задачу.<br />Большие планы начинаются с маленьких шагов.</p>
        </div>
        <footer class="footer"><span id="storage-status">Задачи хранятся в этом браузере</span></footer>
        <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
      </main>
    </div>
    <dialog id="list-picker-dialog" aria-labelledby="list-picker-heading">
      <div class="dialog-heading">
        <h2 id="list-picker-heading">Мои списки</h2>
        <button id="close-list-picker" class="icon-button" type="button" aria-label="Закрыть списки">×</button>
      </div>
      <nav class="list-nav dialog-scroll" aria-label="Списки задач"></nav>
      <button class="edit-save" type="button" data-create-list>Новый список</button>
    </dialog>
    <dialog id="list-name-dialog" aria-labelledby="list-name-heading">
      <form id="list-name-form" novalidate>
        <h2 id="list-name-heading">Новый список</h2>
        <label for="list-name">Название списка</label>
        <input id="list-name" class="edit-input" type="text" autocomplete="off" aria-describedby="list-name-error" />
        <p id="list-name-error" class="edit-error" aria-live="polite"></p>
        <div class="edit-controls">
          <button id="list-name-cancel" class="edit-cancel" type="button">Отмена</button>
          <button id="list-name-save" class="edit-save" type="submit">Создать</button>
        </div>
      </form>
    </dialog>
    <dialog id="delete-list-dialog" aria-labelledby="delete-list-heading" aria-describedby="delete-list-description delete-list-name-text">
      <form id="delete-list-form">
        <h2 id="delete-list-heading">Удалить список?</h2>
        <p id="delete-list-description"></p>
        <div id="delete-list-name" class="dialog-scroll" role="region" tabindex="0" aria-label="Название удаляемого списка"><span id="delete-list-name-text"></span></div>
        <div class="edit-controls">
          <button id="delete-list-cancel" class="edit-cancel" type="button">Отмена</button>
          <button class="edit-save" type="submit">Удалить</button>
        </div>
      </form>
    </dialog>
    <noscript>Для работы списка задач включите JavaScript в браузере.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
